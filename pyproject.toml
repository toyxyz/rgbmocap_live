[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbmocap-live"
version = "0.1.0"
description = "Real-time PEAR and InstantHMR capture and skeletal streaming for Windows"
license = {file = "LICENSE"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mocap*"]
